# PROPOSAL ONLY -- not installed. Do not deploy without owner approval.
# TimeoutStopSec=infinity intentionally permits a potentially indefinite wait;
# there is no bound/deadline and no OOM protection.
# Existing ExecStart, Restart, User, Group, Environment, WorkingDirectory and
# venv settings are preserved; this drop-in sets none of them and declares no
# EnvironmentFile.
[Service]
KillMode=mixed
KillSignal=SIGTERM
SendSIGKILL=no
TimeoutStopSec=infinity
